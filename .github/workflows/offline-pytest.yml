name: Offline pytest

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: offline-pytest-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline-pytest:
    name: pytest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    env:
      OPENROUTER_API_KEY: ""
      OPENAI_API_KEY: ""
      PYTHONDONTWRITEBYTECODE: "1"
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
      PYTEST_ADDOPTS: ""
      PYTEST_PLUGINS: ""
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Check tracked files for local outputs and obvious secrets
        run: python .github/scripts/check_tracked_safety.py
      - name: Install project and offline test guard
        run: python -m pip install -e ".[dev]" pytest-socket==0.7.0
      - name: Offline pytest
        run: python -m pytest -p pytest_socket -q --disable-socket
